[project]
name = "aobs"
version = "0.1.0"
description = "Amnesic Offline Bitcoin Signer — pure core and test harness"
requires-python = ">=3.12"
# `embit` is absent on purpose: `docs/boot-pipeline.md` vendors it into the app tree, pinned by
# git SHA, so the prebuilt `libsecp256k1` blob that only exists in the PyPI wheel never enters
# the repository (#34). See `aobs/core/vendor/README.md`.
#
# THIS FILE IS THE APPLIANCE'S PYTHON MANIFEST, not just the harness's. Every Python
# package in the image comes from here, resolved and hash-pinned in `uv.lock`, fetched as
# wheels by `build/fetch-inputs.sh` and installed offline — none of it comes from Debian.
# `docs/adr/0002-python-dependencies-from-pinned-wheels.md` says why.
#
# So the two groups below are load-bearing: `dependencies` is what the rootfs gets,
# `optional-dependencies.test` is what only the test tier gets, and `build/verify.py`
# fails the build if a name from the second reaches the image. They were previously
# mis-grouped — `textual`, `pillow` and `zxing-cpp` sat under `test` while being imported
# by appliance code, and the comment there asserted the opposite of what the code does.
dependencies = [
    "cryptography>=44",
    "argon2-cffi>=23.1",
    # The appliance IS a Textual application: `aobs/ui/app.py`. `rich` arrives with it.
    "textual>=8.2",
    # The appliance's own QR renderer turns a payload into a module matrix with this, and draws
    # the matrix as half-block text itself — so no image library is involved on the way out.
    # `qrcode`, not `segno`, and the reason is no longer "what Alpine packages": it is what the
    # renderer in `aobs/ui/qrcodes.py` was written against.
    "qrcode>=8",
    # Inbound, not outbound, and both are appliance dependencies rather than harness ones:
    # `aobs/ui/qrdecode.py` decodes a captured frame with `zxingcpp` and wraps it in a
    # `PIL.Image`, and `aobs/ui/screens/scan.py` — an appliance screen — calls it. The V4L2
    # adapter reads raw frames through `ioctl`; deciding what is in them is this.
    "zxing-cpp>=2.2",
    "pillow>=10",
]

[project.optional-dependencies]
# The harness, and nothing that reaches the rootfs.
test = [
    "pytest>=8",
    # `run_test()` is an async context manager, so the app suite is async. `asyncio_mode =
    # "auto"` below is what keeps that from being a decorator on every test.
    "pytest-asyncio>=1.3",
    "hypothesis>=6",
    # An independent implementation of the UR registry types, used only to check our own
    # `crypto-output` CBOR against something that is not us.
    "urtypes>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The regtest suite needs a bitcoind; it is opt-in and outside the default loop.
addopts = "-m 'not regtest'"
markers = [
    "regtest: needs a local bitcoind in regtest mode (opt-in: -m regtest)",
]
