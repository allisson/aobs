[project]
name = "aobs"
version = "0.1.0"
description = "Amnesic Offline Bitcoin Signer — pure core and test harness"
requires-python = ">=3.12"
dependencies = [
    "embit>=0.8.0",
    "cryptography>=44",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# The harness. `zxing-cpp` and `segno` are the loopback test's two ends; the
# appliance's own renderer and camera adapter land in a later spec.
test = [
    "pytest>=8",
    # `run_test()` is an async context manager, so the app suite is async. `asyncio_mode =
    # "auto"` below is what keeps that from being a decorator on every test.
    "pytest-asyncio>=1.3",
    "hypothesis>=6",
    "zxing-cpp>=2.2",
    # `qrcode`, not `segno`: `py3-qrcode` is what Alpine packages, and the authoritative tier
    # installs the versions the ISO installs.
    "qrcode>=8",
    "pillow>=10",
    "textual>=0.80",
    # An independent implementation of the UR registry types, used only to check our own
    # `crypto-output` CBOR against something that is not us.
    "urtypes>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The regtest suite needs a bitcoind; it is opt-in and outside the default loop.
addopts = "-m 'not regtest'"
markers = [
    "regtest: needs a local bitcoind in regtest mode (opt-in: -m regtest)",
]
