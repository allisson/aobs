# 01-boot-layer.md §3, control 3 — a COMPLEMENT to deletion, not a substitute.
#
# `install <module> /bin/false` blocks modprobe and udev autoload. It does not block
# `insmod` on a .ko that is still present, which is why the primary control
# (0200-aobs-no-network-modules.hook.chroot) deletes the modules outright and this file only
# has to matter if that ever silently stops working.
#
# `blacklist` is NOT this, and is deliberately absent: it suppresses alias-driven loading
# only, and an explicit `modprobe e1000e` still loads. Do not use it where the intent is
# "never load this".
#
# This list cannot be exhaustive — there is no glob syntax here and no fixed set of
# network drivers. It names the families a machine autoloads from its own hardware.

# Wired
install e1000 /bin/false
install e1000e /bin/false
install igb /bin/false
install igc /bin/false
install ixgbe /bin/false
install r8169 /bin/false
install tg3 /bin/false
install atlantic /bin/false
install alx /bin/false
install sky2 /bin/false
install via-rhine /bin/false

# USB-attached wired, which is how a network arrives on a machine that has none
install usbnet /bin/false
install cdc_ether /bin/false
install cdc_ncm /bin/false
install rndis_host /bin/false
install r8152 /bin/false
install ax88179_178a /bin/false
install asix /bin/false

# Wireless, and the stacks underneath it
install cfg80211 /bin/false
install mac80211 /bin/false
install iwlwifi /bin/false
install ath9k /bin/false
install ath10k_pci /bin/false
install ath11k_pci /bin/false
install ath12k /bin/false
install mt76 /bin/false
install mt7921e /bin/false
install rtw88_pci /bin/false
install rtw89_pci /bin/false
install brcmfmac /bin/false
install rt2800pci /bin/false

# Bluetooth
install bluetooth /bin/false
install btusb /bin/false
install btintel /bin/false
install btrtl /bin/false
