# 01-boot-layer.md §2, no-shell-escape control 1: no gettys at all, not even the default.
# §4: a closed lid must not suspend a machine holding a seed.
[Login]
NAutoVTs=0
ReserveVT=0
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
