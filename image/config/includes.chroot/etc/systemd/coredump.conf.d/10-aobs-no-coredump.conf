# 01-boot-layer.md §4. This matters more than it looks: the default Storage=external
# writes a COMPLETE COPY OF THE SEED to a file with a predictable name, tmpfs or not.
#
# Both settings, not one. Storage=none stops the file; ProcessSizeMax=0 stops systemd
# from even asking the kernel for the image.
[Coredump]
Storage=none
ProcessSizeMax=0
