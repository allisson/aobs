# The legacy BIOS boot path. `build/grub.cfg` is the UEFI one, and the two cmdlines differ by
# exactly one option — `vga=791` — for the reason below.
#
# NO MENU. There is one thing to boot and nothing to configure; a menu on an appliance is a screen
# that exists to be skipped. That principle stands and this file still has no menu.
#
# WHAT CHANGED, AND WHY: THERE IS NOW A PROMPT. This file used to set `PROMPT 0` and `TIMEOUT 0`,
# on the argument that a person standing at the bootloader could type `rdinit=/bin/sh` and that
# this cost nothing. The second half was true and the first half was not, and nobody found out
# until somebody stood at a machine and tried it:
#
#   * Under `PROMPT 0`, SYSLINUX shows the `boot:` prompt only while SHIFT or ALT is held, or with
#     CAPS LOCK or SCROLL LOCK set — and reads that from the BIOS keyboard-flags byte, which the
#     firmware has to populate. On the machine in `docs/boot-runs/` (coreboot `RW_LEGACY` SeaBIOS,
#     Chromebook) SHIFT and ALT on the built-in keyboard produced nothing at all. An external USB
#     keyboard with CAPS LOCK set produced the prompt at once. That machine also has no CAPS LOCK
#     and no SCROLL LOCK key, so two of the four documented ways in do not physically exist there.
#   * With `TIMEOUT 0` there was no window to react to, because nothing was displayed.
#
# The inspection boot is what makes every ABSENCE claim in this project checkable by a stranger.
# A door that opens only on firmware that populates one BIOS byte is not a door those claims can
# rest on, and three seconds of `boot:` is a smaller price than an unverifiable appliance. The
# timeout is also cancelled the moment anything is typed, so nobody is racing it.
#
# THE SECOND LABEL exists so that reaching the inspection boot needs no remembered syntax. Typing
# `inspect` is enough; TAB at the prompt lists both. The old instruction — type the label, then
# append the parameter — still works and is still documented, because a stranger who distrusts a
# label named `inspect` should be able to spell out what it does:
#
#     boot: aobs rdinit=/bin/sh
#
# `rdinit=` AND NOT `init=`. The rootfs is the initramfs, so the kernel never mounts a root and
# never consults `init=`: it runs `ramdisk_execute_command` (`/init` by default, `rdinit=` to
# override) and only tries `init=` if that FAILS. `/init` is this project's PID 1 and it succeeds,
# so an `init=` here boots the appliance normally — no error, no hint, a command line that looks
# like it worked. It was documented that way in six places for as long as this project existed.
# `tests/test_structure.py` fails the build if the wrong one comes back.
#
# `docs/boot-checklist.md` is the procedure both of these serve, and it also records the part no
# config file can fix: on that machine the external keyboard stops working the moment the kernel
# starts — an inspection boot loads no modules, so USB HID has no driver — and the shell has to be
# driven from the laptop's own keyboard.

DEFAULT aobs
PROMPT 1
# 1/10 s units, so three seconds, and cancelled by the first keystroke.
TIMEOUT 30

SAY
SAY   aobs   - the appliance (default)
SAY   inspect - a shell as PID 1, to check the image's absence claims
SAY

LABEL aobs
    KERNEL /boot/vmlinuz
    INITRD /boot/initramfs.zst
    # vga=791 IS NOT COSMETIC. `vgacon` gives an 80x25 text console, and the QR display is fixed at
    # 85 columns x 43 rows — so a BIOS boot in text mode could not draw a QR code at all. 791 is
    # 1024x768x16, which brings up the built-in `vesafb` and gives fbcon 128x48.
    #
    # UEFI needs no equivalent: `efifb` takes the resolution the firmware's GOP already set.
    #
    # random.trust_cpu / random.trust_bootloader both default ON, and leaving them there would rest
    # the entropy floor on RDRAND and on a firmware seed. `docs/entropy-mixing.md` states what the
    # floor promises instead.
    #
    # panic=0 means hang rather than reboot. There is nothing to reboot into, and a reboot loop
    # flashes the failure past the one person who needs to read it.
    APPEND vga=791 random.trust_cpu=off random.trust_bootloader=off panic=0

LABEL inspect
    KERNEL /boot/vmlinuz
    INITRD /boot/initramfs.zst
    # IDENTICAL to `aobs` but for `rdinit=/bin/sh`, and that is the point: an inspection boot that
    # differed in any other option would be inspecting a different image from the one that signs.
    # `vga=791` in particular has to stay, or `I-7` measures a console the appliance never uses.
    APPEND vga=791 random.trust_cpu=off random.trust_bootloader=off panic=0 rdinit=/bin/sh
