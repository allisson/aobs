# The legacy BIOS boot path. `docs/boot-pipeline.md`: the same stick must boot an older machine
# kept offline for exactly this purpose, and modern UEFI hardware — `grub.cfg` is the other half.
#
# `PROMPT 0` with `TIMEOUT 0` boots the single entry immediately. There is nothing to choose
# between: one kernel, one initramfs, one appliance. A menu would be a decision the user cannot
# make wrongly and therefore should not be asked.
#
# The cmdline below is asserted by `build/verify.py`, which is why it is here as a fixed string
# rather than assembled by the build script. Every parameter carries a published claim:
#
#   vga=791                      1024×768, so `vesafb` gives `fbcon` a graphical framebuffer at
#                                128×48. **Not cosmetic**: without it `vgacon` gives 80×25 text and
#                                #3's 85×43 QR code cannot be displayed at all.
#   random.trust_cpu=off         the entropy floor does not silently rest on RDRAND (#8).
#   random.trust_bootloader=off  no bootloader-supplied seed alone initialises the RNG (#8).
#   panic=0                      hang on a visible message rather than rebooting in a loop that
#                                flashes the explanation past the user.
#   init_on_free=1               a page CPython returns to the kernel does not retain a key
#                                (`docs/secret-hygiene.md`, bounded there).
#
# There is deliberately no `init=`: for an initramfs the kernel runs `/init`, which is our script.
# No `quiet` either — the kernel's own messages are the only thing on screen until the app starts,
# and a user watching a boot that fails should see why.
#
# A person at the bootloader typing `init=/bin/sh` is undefended and stated as such in
# `docs/boot-pipeline.md`. It costs nothing: a fresh boot holds no secrets, which is the point of
# the amnesia claim.

DEFAULT aobs
PROMPT 0
TIMEOUT 0

LABEL aobs
  MENU LABEL aobs - offline bitcoin signer
  LINUX /boot/vmlinuz
  INITRD /boot/initramfs.zst
  APPEND vga=791 random.trust_cpu=off random.trust_bootloader=off panic=0 init_on_free=1
