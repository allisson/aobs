# Installed as `/etc/modprobe.d/aobs.conf`. A cheap second line, and **never the claim**.
#
# The claim `docs/boot-pipeline.md` makes is that the module is not in the image: `build/mkiso.sh`
# deletes everything outside `build/modules.allow` and its dependency closure, and
# `build/verify.py` fails the build if anything else is left. `modprobe` cannot load a file that
# does not exist, so on a correctly built image every line below is a no-op.
#
# WHAT IT IS ACTUALLY FOR is one window. `build/init` loads the allowlist in step 3 and sets
# `kernel.modules_disabled=1` in step 5, and between those two the kernel's own usermode helper
# will happily answer a device match by asking for a module by name. A network card appearing on
# the PCI bus during that window is the case this file covers, and `install ... /bin/false` covers
# it more firmly than `blacklist` does: `blacklist` only suppresses *alias* matching, while
# `install` replaces the load with a command that fails, including for an explicit request.
#
# IT IS NOT EXHAUSTIVE AND CANNOT BE. `modprobe` has no default-deny, so a file like this can only
# name things, and Debian's kernel has 4229 modules. That is exactly why it is not the claim and
# why the prune is.

# The network claim, at the two names any autoloaded stack would come through first.
install af_packet /bin/false
install bonding /bin/false
install e1000e /bin/false
install igb /bin/false
install r8169 /bin/false
install iwlwifi /bin/false
install cfg80211 /bin/false
install mac80211 /bin/false
install bluetooth /bin/false
install btusb /bin/false

# Storage. The appliance reads the boot medium exactly once, through firmware, before this file
# exists; after that there is nothing it wants to see a disk for.
install usb_storage /bin/false
install uas /bin/false
install ahci /bin/false
install nvme /bin/false
install sd_mod /bin/false
install sr_mod /bin/false
install mmc_core /bin/false

# Filesystems that only matter if something above succeeded anyway.
install vfat /bin/false
install ext4 /bin/false
install ntfs3 /bin/false
install exfat /bin/false
