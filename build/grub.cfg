# The UEFI boot path. Embedded into a standalone `bootx64.efi` by `build/mkiso.sh`, so this file
# is the configuration GRUB carries rather than one it looks for on the medium — nothing is read
# from the ISO after the kernel and the initramfs are in memory, which is the amnesia claim's
# cheapest check.
#
# Secure Boot is NOT supported in v0.1 and the firmware setting has to be off. Debian's signed
# shim + grub + kernel make it genuinely achievable — pruning the modules tree does not touch the
# kernel image's signature — but it is a second boot path to test and it raises reproducibility
# questions about signed blobs. `docs/roadmap.md` has it as the best candidate for the first
# post-v0.1 milestone.

set timeout=0
set default=0

menuentry "aobs" {
    # No `vga=` here, unlike the BIOS path: `efifb` is built in and comes up at whatever resolution
    # the firmware's GOP already set, which is 1024x768 or better on anything that boots UEFI.
    # `build/isolinux.cfg` explains why the BIOS path cannot rely on that.
    linux /boot/vmlinuz random.trust_cpu=off random.trust_bootloader=off panic=0
    initrd /boot/initramfs.zst
}
