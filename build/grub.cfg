# The UEFI boot path. `isolinux.cfg` is the legacy BIOS half of the same stick.
#
# **Secure Boot must be disabled in firmware.** The kernel is unsigned and will stay unsigned: a
# shim chain means Microsoft-signed binaries and a release-signing process, and it would put a
# third party's signature in the trust path of an appliance whose pitch is that you can verify it
# yourself. `docs/boot-pipeline.md` states the requirement; `README.md` repeats it where a user
# writing the stick will read it, because a failed boot must be a known step and not a mystery.
#
# The cmdline is asserted by `build/verify.py` and is the same as the BIOS path's minus `vga=791`,
# which is meaningless here: the UEFI firmware framebuffer is already graphical, `efifb` takes
# whatever resolution firmware provides, and 1024×768 is the floor on both paths.
#
# `timeout=0` boots immediately. One kernel, one initramfs, one appliance; a menu would be a
# decision the user cannot make wrongly and therefore should not be asked.

set default=0
set timeout=0

menuentry "aobs - offline bitcoin signer" {
	linux /boot/vmlinuz random.trust_cpu=off random.trust_bootloader=off panic=0 init_on_free=1
	initrd /boot/initramfs.zst
}
