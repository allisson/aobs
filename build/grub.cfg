# The UEFI boot path. Embedded into a standalone `bootx64.efi` by `build/mkiso.sh`, so this file
# is the configuration GRUB carries rather than one it looks for on the medium — nothing is read
# from the ISO after the kernel and the initramfs are in memory, which is the amnesia claim's
# cheapest check.
#
# Secure Boot is NOT supported in v0.1 and the firmware setting has to be off. Debian's signed
# shim + grub + kernel make it genuinely achievable — pruning the modules tree does not touch the
# kernel image's signature — but it is a second boot path to test and it raises reproducibility
# questions about signed blobs. `docs/roadmap.md` has it as the best candidate for the first
# post-v0.1 milestone.

# TWO ENTRIES AND A SHORT TIMEOUT, matching `build/isolinux.cfg`, which carries the full argument.
# In short: the inspection boot is what makes every ABSENCE claim checkable by a stranger, and it
# used to be reachable only by editing a hidden entry with `e` on a menu that `timeout=0` never
# showed. GRUB's `e` still works and is still documented — a stranger who distrusts an entry named
# `inspect` should be able to spell out what it does — but it is no longer the only way in.
set timeout=3
set default=0

menuentry "aobs" {
    # No `vga=` here, unlike the BIOS path: `efifb` is built in and comes up at whatever resolution
    # the firmware's GOP already set, which is 1024x768 or better on anything that boots UEFI.
    # `build/isolinux.cfg` explains why the BIOS path cannot rely on that.
    linux /boot/vmlinuz random.trust_cpu=off random.trust_bootloader=off panic=0
    initrd /boot/initramfs.zst
}

menuentry "inspect — a shell as PID 1, to check the image's absence claims" {
    # IDENTICAL to `aobs` but for `rdinit=/bin/sh`. An inspection boot that differed in any other
    # option would be inspecting a different image from the one that signs.
    #
    # `rdinit=` and NOT `init=`: the rootfs is the initramfs, so the kernel never mounts a root and
    # never consults `init=` — it runs `/init`, which is this project's PID 1, and boots the
    # appliance with no error and no hint. `build/isolinux.cfg` has the detail.
    linux /boot/vmlinuz random.trust_cpu=off random.trust_bootloader=off panic=0 rdinit=/bin/sh
    initrd /boot/initramfs.zst
}
