# The one tier `docs/test-harness.md` names, on every push and every pull request: an `alpine:3.24`
# container installing **the exact apk versions the ISO installs**, so a skew in `zxing-cpp`,
# `cryptography` or `libsecp256k1` fails here rather than on the appliance.
#
# There used to be a second `fast` job running `uv` on the host Python. #35 retired it. It never
# caught anything this job cannot — the claim ran the other way — and once `embit` was vendored
# without its prebuilt binary (#34) a runner with no system `libsecp256k1` fell back to
# `py_secp256k1`, which took that job from ~17 s to ~6 minutes. A tier 17x slower than the
# authoritative one, testing PyPI-resolved libraries on a non-Alpine Python, is not a dev loop and
# is not a signal.
#
# The regtest suite is deliberately absent: it needs a `bitcoind` and stays opt-in, so a
# contributor with no node still gets the full default suite. `docs/boot-checklist.md` holds what
# only a boot can check, and no runner can check any of it.
#
# Every action is pinned to a commit SHA, not a tag. A tag is a movable pointer, and a repository
# whose entire selling point is that every input is pinned cannot make an exception for the thing
# that builds it.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authoritative:
    name: authoritative tier (alpine, pinned apks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container
        run: docker build -f build/Dockerfile.test -t aobs-test .

      - name: Run the suite
        # No bind mount here, unlike the dev loop: what CI judges is the tree as pushed, which is
        # the copy baked into the image.
        run: docker run --rm aobs-test
