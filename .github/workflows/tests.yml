# The one tier `docs/roadmap.md` M1 names, on every push to main and every pull request: a
# `debian:trixie-slim` container with apt pointed at the pinned snapshot, installing the exact
# package versions the ISO installs and the exact Python versions `uv.lock` resolves. A skew in
# `zxing-cpp`, `cryptography`, `textual` or `libsecp256k1` fails here rather than on the appliance.
#
# There is no second job running the suite on the runner's own Python, and that is a decision the
# predecessor made the hard way. With `embit` vendored without its prebuilt blob, a machine that
# has no system `libsecp256k1` silently falls back to `py_secp256k1` — measured here at 1.73 ms per
# `ec_pubkey_create` and a 22-minute suite. Such a job is 50-80x slower, tests differently-resolved
# libraries, and passes while exercising the one code path `docs/boot-pipeline.md` forbids on the
# appliance. It is not a signal. `CLAUDE.md` states the rule.
#
# The regtest suite is deliberately absent: it needs a `bitcoind` and stays opt-in, so a
# contributor with no node still gets the full default suite. `docs/boot-checklist.md` holds what
# only a boot can check, and no runner can check any of it.
#
# Every action is pinned to a commit SHA, not a tag. A tag is a movable pointer, and a repository
# whose entire selling point is that every input is pinned cannot make an exception for the thing
# that builds it.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: the pinned lists agree with uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `uv` from pip at a pinned version rather than a marketplace action. One less third-party
      # action to pin by SHA, and the version that resolves the lock here is the version named
      # here — visible in the diff, like every other pin in this repository.
      - name: Install uv
        run: |
          python3 -m pip install --quiet --user uv==0.10.11
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # docs/adr/0002 keeps every wheel hash in uv.lock so there is one place for one fact.
      # build/requirements.*.txt are a second copy, because pip needs a form it can read and
      # neither the image build nor this tier carries uv. This step is the mechanism that makes
      # the copy safe: regenerate both and fail if either differs from what is committed.
      - name: Requirement files match the lock
        run: sh build/gather-requirements.sh --check

      # The pin files' own contract, before anything is fetched or installed: both parse, the
      # groups are disjoint, and no `python3-*` package sits in the apt list. `tests/
      # test_build_verifier.py` proves each of those assertions still bites; this runs them
      # against the committed lists. It needs no inputs and no container, so it fails in seconds
      # here rather than in minutes there.
      - name: The pin files parse and the groups stay disjoint
        run: python3 build/verify.py

      # The version list is derived from the same lock, and drifts the same way.
      - name: build/wheel-versions.txt matches the lock
        run: |
          sh build/gather-wheel-versions.sh > /tmp/fresh.txt
          grep -oE '^[a-z0-9._-]+==[^ ]+' build/wheel-versions.txt | sort > /tmp/committed.pins
          grep -oE '^[a-z0-9._-]+==[^ ]+' /tmp/fresh.txt | sort > /tmp/fresh.pins
          diff -u /tmp/committed.pins /tmp/fresh.pins

  authoritative:
    name: authoritative tier (debian trixie, pinned apt + wheels)
    runs-on: ubuntu-latest
    # The suite takes minutes here, not the 22 the pure-Python fallback costs, because the
    # container has a real libsecp256k1. If this job ever approaches that figure, the EC backend
    # is the first thing to check, not the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build/inputs/ is every byte the image consumes, and it is gitignored because
      # build/fetch-inputs.sh produces it. The key is the hash of the pin files themselves, so a
      # cache hit means "the same pins as last time" and a pin change is a cache miss by
      # construction — never a stale pool silently reused.
      #
      # The cache is a speed optimisation and nothing more. On a miss, `fetch-inputs.sh` fetches
      # from deb.debian.org and verifies the result against the committed `build/inputs.sha256` —
      # hashes that were produced from snapshot.debian.org by a human running `--refresh`. Measured
      # 2026-09-07: the mirror served all 169 MB in 6 s and the pool matched the snapshot-derived
      # hashes byte for byte, while snapshot itself hung this job past ten minutes from a runner.
      # Which host served a byte is not what makes the build reproducible; the hash file is.
      - name: Cache build/inputs
        id: inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/inputs
          # `build/inputs.sha256` is in the key, and it is the one that actually makes a hit mean
          # "the same bytes as last time". The pin files alone do not: the M2 closure fix changed
          # what those same eight pins RESOLVE to — the appliance pool went from 37 packages to 57
          # — with every pin file byte-identical. A key over pins only would have restored the
          # stale pool and failed the step below, which is the right failure but the wrong reason
          # to pay for a CI run.
          key: inputs-${{ hashFiles('build/inputs.sha256', 'build/apt-versions.txt', 'build/requirements.appliance.txt', 'build/requirements.test.txt', 'build/snapshot.env') }}

      - name: Fetch inputs
        if: steps.inputs.outputs.cache-hit != 'true'
        run: sh build/fetch-inputs.sh

      # On a cache hit the pool was not re-fetched, so verify it against the checked-in hashes
      # before trusting it. On a miss fetch-inputs.sh has already done this; doing it twice costs
      # a second and means the gate is never skipped by a code path.
      - name: Inputs match build/inputs.sha256
        run: |
          sha256sum -c build/inputs.sha256
          named=$(wc -l < build/inputs.sha256)
          present=$(find build/inputs -type f | wc -l)
          echo "inputs: $named named, $present present"
          test "$named" -eq "$present"

      # The closure checks, which need a fetched pool and so cannot run in the `pins` job. They
      # read the RESOLVED pool rather than the pin files, and that is the point: not one of the
      # names they catch is pinned anywhere. `systemd` reaches the closure through
      # `linux-image-amd64` -> `initramfs-tools` -> `udev`, and a Debian Python library would
      # arrive as a dependency of something unrelated to Python. `build/verify.py`'s pin-file
      # checks read the eight names a human typed and cannot see either.
      #
      # An explicit `--closure` flag rather than "run if the directory exists": a check that
      # silently passes when its input is absent passes loudest exactly when it was skipped.
      - name: No init system and no Debian Python library in the appliance closure
        run: python3 build/verify.py --closure build/inputs/deb/appliance

      - name: Build the container
        run: docker build -f build/Dockerfile.test -t aobs-test .

      # One run, and the skip policy is inside it rather than around it.
      #
      # M1 requires that this tier skip nothing that is about the appliance: the three entropy
      # tests, the EC-backend assertion and the keymap-tree assertion are guarded by
      # AOBS_AUTHORITATIVE_TIER and by `os.GRND_NONBLOCK`, and this container is the only place
      # they run. A tier that reports those as skipped is not authoritative — the keymap one is
      # not hypothetical: on its first run here it failed and caught the picker silently dropping
      # ABNT2.
      #
      # This step used to parse `N skipped` out of `-q` output with sed and compare it to 4. The
      # gate now lives in `tests/conftest.py` as SKIPS_ALLOWED, keyed by node id: a count cannot
      # tell a fifth skip from one of the four moving, and it cannot fail an entry that has
      # stopped skipping. `-rs` stays, so the same run still prints why each one skipped.
      #
      # The same conftest refuses to start this container at all if embit resolved to
      # `py_secp256k1`, so this job cannot report green from a pure-Python signer.
      #
      # No bind mount, unlike the dev loop: what CI judges is the tree as pushed, which is the
      # copy baked into the image.
      - name: Run the suite
        run: docker run --rm aobs-test python3 -m pytest -rs

  image:
    name: the image builds, unprivileged
    runs-on: ubuntu-24.04
    # `ubuntu-24.04` and not `ubuntu-latest`, deliberately. This job's whole first claim is that
    # `mmdebstrap --mode=unshare` works with no `--privileged`, and 24.04 is the release that ships
    # `kernel.apparmor_restrict_unprivileged_userns=1` — the setting that denies exactly the
    # `unshare(CLONE_NEWUSER)` the mode is named after. Pinning the runner keeps the claim attached
    # to the distribution it was measured on rather than to whatever `latest` becomes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache build/inputs
        id: inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/inputs
          key: inputs-${{ hashFiles('build/inputs.sha256', 'build/apt-versions.txt', 'build/requirements.appliance.txt', 'build/requirements.test.txt', 'build/snapshot.env') }}

      - name: Fetch inputs
        if: steps.inputs.outputs.cache-hit != 'true'
        run: sh build/fetch-inputs.sh

      # The build tools, and the one place in this repository where a version is not pinned. They
      # are the host's, not the image's: every byte that lands in the ISO comes from
      # `build/inputs/`, and `sha256sum -c` in stage 0 is what says so. What a differently-versioned
      # `mmdebstrap` or `xorriso` could still change is the ARRANGEMENT of those bytes, which is a
      # reproducibility question rather than a contents one — `docs/reproducible-build.md` at M4 is
      # where it gets answered, and it is written down here rather than left to be discovered.
      - name: The build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap uidmap dpkg-dev kmod zstd xorriso mtools \
            grub-efi-amd64-bin isolinux syslinux-common binutils
          mmdebstrap --version

      # No `sudo` on this line and no `--privileged` anywhere in the job. That is the claim.
      - name: Build the ISO
        run: sh build/mkiso.sh

      - name: The measurements, as measurements
        run: |
          ls -l out/bitcoin-signer-amd64.iso
          xorriso -indev out/bitcoin-signer-amd64.iso -report_el_torito plain 2>&1 | grep 'El Torito'
