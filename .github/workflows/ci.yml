name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Everything runs in the one build environment, so CI and a developer's machine cannot
  # resolve different compilers or a different live-build.
  BUILD_IMAGE: aobs-build

jobs:
  source:
    name: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the build environment
        run: docker build -f ci/build-env.Dockerfile -t "$BUILD_IMAGE" ci

      - name: Format
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" cargo fmt --all --check

      - name: Clippy
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE"
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" cargo test --workspace --locked

      # 05-testing-and-release.md §6.1, the checks that read the tree.
      - name: Mechanical checks
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" ci/check-source.sh

      # The test on the test: §1's ban on per-function coverage opt-outs is only enforced
      # while the check above still bites, and a typo in its regex turns that row green
      # forever without anything noticing.
      - name: The mechanical checks still bite
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" ci/check-source-test.sh

  # 05-testing-and-release.md §1: >= 95% region coverage on aobs-core, >= 98% on each of
  # the nine components in ci/coverage-components.tsv.
  #
  # Its own job, not a step in `source`, because §1 says so in its own words: coverage is
  # necessary and not sufficient, and the other gates are not a subset of the coverage run.
  # Keeping them separate is also what stops a red coverage number from being read as a
  # failing test suite, or the reverse.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the build environment
        run: docker build -f ci/build-env.Dockerfile -t "$BUILD_IMAGE" ci

      - name: Region coverage
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" ci/check-coverage.sh

  # 05-testing-and-release.md §4. The three targets are ours to write and none of the code
  # they fuzz exists yet, so what this job proves today is the harness — cargo-fuzz builds
  # in the one build environment and a target runs to completion. Also its own job: it
  # needs a nightly toolchain and a sanitizer that the test run has no business carrying.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the build environment
        run: docker build -f ci/build-env.Dockerfile -t "$BUILD_IMAGE" ci

      - name: Build and run the fuzz targets
        run: docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE" ci/check-fuzz.sh

  image:
    name: image
    runs-on: ubuntu-latest
    needs: source
    # The default is GitHub's six hours, and a job that boots three machines under TCG has
    # no honest reason to approach it. Run 32084441517 sat in `apt-get update` for five
    # and a half hours before the platform killed it; a build plus every row below is
    # roughly forty minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build the build environment
        run: docker build -f ci/build-env.Dockerfile -t "$BUILD_IMAGE" ci

      - name: Build /usr/bin/aobs
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE"
          ci/build-binary.sh

      # `lb build` chroots and mounts, so it needs both root and --privileged.
      - name: Build bitcoin-signer-amd64.iso
        run: >
          docker run --rm --privileged -v "$PWD:/src" -w /src "$BUILD_IMAGE"
          image/build.sh

      # 05-testing-and-release.md §6.1, the check that needs the artifact.
      - name: Mechanical checks against the image
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$BUILD_IMAGE"
          ci/check-image.sh bitcoin-signer-amd64.iso

      # The acquire options are what make a stalled mirror fail instead of hang — the run
      # above lost its whole budget to one, with no timeout on the socket to end it — and
      # the step timeout is the backstop for whatever they do not cover.
      - name: Install QEMU and OVMF
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 qemu-system-x86 ovmf

      # 05-testing-and-release.md §6.2, the fbdev tier: OVMF + ramfb with no GPU. This is
      # the row that can fail — the machines with a DRM driver were never the question.
      - name: Boot it on ramfb, no GPU
        env:
          AOBS_QEMU_GPU: ramfb
        run: ci/qemu-boot.sh bitcoin-signer-amd64.iso 4096 900

      # §6.2's other display row: a native KMS driver, i.e. the DRM tier.
      - name: Boot it on virtio-gpu
        env:
          AOBS_QEMU_GPU: virtio-gpu
        run: ci/qemu-boot.sh bitcoin-signer-amd64.iso 4096 900

      # §6.2's fbcon regression row — #52's probe, standing. It is also where `Type=notify`
      # and the two `+`-prefixed console scripts are asserted: its start count refuses a
      # unit that restarted.
      - name: The fbcon regression
        run: ci/fbcon-probe.sh bitcoin-signer-amd64.iso 4096 900

      # §7 requires the low-memory GRUB entry to degrade rather than brick. The floor is
      # provisional at 2 GiB until measured against the built image (00-overview.md), so
      # this run is what produces the number rather than asserting one.
      - name: Boot it at the provisional RAM floor
        continue-on-error: true
        run: ci/qemu-boot.sh bitcoin-signer-amd64.iso 2048 900

      # The panel captures are the whole of the evidence when a display or fbcon row fails,
      # and they exist only on the runner.
      - name: Keep the panel captures from a failed row
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panel-captures
          path: bitcoin-signer-amd64-*.ppm
          if-no-files-found: ignore
          retention-days: 14

      # ADR-0012 and §7.4: the package manifest is published because §3's
      # stripped-network claim is otherwise uncheckable without building the image.
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-signer-amd64
          path: |
            bitcoin-signer-amd64.iso
            bitcoin-signer-amd64.packages
          retention-days: 14
