# The fuzz crate (05-testing-and-release.md §4).
#
# The root manifest excludes `fuzz/` rather than listing it as a member: as a member it
# would drag libfuzzer-sys and a nightly-only build into `cargo test --workspace`. Being
# outside the workspace is also why this crate carries its own lockfile.
[package]
name = "aobs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `arbitrary-derive` is what makes §4's third target structure-aware: it generates a *plan*
# of inputs and outputs rather than bytes, so the mutator's budget goes on the checks
# instead of on the four magic bytes at the front of a PSBT.
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
# The validator target builds the PSBTs it feeds in, which means constructing transactions,
# scripts and derivation paths. Same version as aobs-core's, resolved through this crate's
# own lockfile.
bitcoin = "0.32"
# The `Arbitrary` derive expands to paths in this crate, so it is a direct dependency even
# though libfuzzer-sys re-exports the trait.
arbitrary = { version = "1", features = ["derive"] }

# §4's three targets all fuzz core: the fountain decoder through our clamping wrapper, the
# PSBT parser on raw bytes, and the validator seeded with our own key material. All three
# are here as of #77, which brought the transport layer the first one wraps.
[dependencies.aobs-core]
path = "../aobs-core"

# 01-boot-layer.md §10 and 05 §6.1: never `panic = "abort"`. libFuzzer catches an unwinding
# panic perfectly well, and ci/check-source.sh fails the build on any manifest that sets
# abort — this one included.
[profile.release]
panic = "unwind"

[[bin]]
name = "fountain_decode"
path = "fuzz_targets/fountain_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "psbt_parse"
path = "fuzz_targets/psbt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validator"
path = "fuzz_targets/validator.rs"
test = false
doc = false
bench = false
